[env:esp32s3]
platform = espressif32 
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

# Force the terminal to display characters as you type them
monitor_echo = yes

# Buffer your typing and only transmit it when you hit 'Enter'
monitor_filters = send_on_enter

# Add Carriage Return only
monitor_eol = LF

lib_deps =
    waspinator/AccelStepper@^1.64.0
    miguelbalboa/MFRC522@^1.4.12
    madhephaestus/ESP32Servo@^3.0.5

build_flags =
    -D CORE_DEBUG_LEVEL=0